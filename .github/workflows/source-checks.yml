name: Source checks (no FPGA hardware)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install source-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl jq build-essential libibverbs-dev libssl-dev iverilog
      - name: Check sources, dependency revisions, driver patch and recorded data
        run: bash scripts/check.sh
      - name: Compile RDMA peer and run offline wire/integrity/Ethernet/control RTL tests
        run: make -C rdma check
      - name: Compile READ peer and run offline protected READ and version2 host tests
        run: make -C rdma/read check
      - name: Check incremental MR and responder admission/backend RTL (no hardware)
        run: make -C rdma/rnic check
