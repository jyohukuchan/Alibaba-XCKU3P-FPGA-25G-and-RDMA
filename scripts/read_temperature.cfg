# Read-only UltraScale+ SYSMONE4 status via JTAG, following AMD UG580 ch. 3.
# No SYSMON write command, configuration load, reset, or flash operation.
adapter driver ftdi
ftdi device_desc "Digilent USB Device"
ftdi vid_pid 0x0403 0x6014
if {![info exists ::env(AS02_JTAG_SERIAL)] || $::env(AS02_JTAG_SERIAL) eq ""} {
    error "Set AS02_JTAG_SERIAL to the explicitly selected Digilent adapter serial"
}
adapter serial $::env(AS02_JTAG_SERIAL)
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
transport select jtag
adapter speed 1000
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
jtag newtap fpga tap -irlen 6 -ircapture 0x01 -irmask 0x03 -expected-id 0x04a63093
pld device virtex2 fpga.tap 1

proc read_sysmon_status {address} {
    if {$address ni {0 1 2 4 6 32 36 63}} {error "Only approved read-only status addresses allowed"}
    set request [expr {0x04000000 | ($address << 16)}]
    drscan fpga.tap 32 $request
    runtest 32
    set response [drscan fpga.tap 32 0x00000000]
    runtest 32
    if {![regexp {^[0-9a-fA-F]+$} $response]} {error "Invalid JTAG response"}
    set numeric "0x$response"
    return [expr {$numeric & 0xffff}]
}
proc as_celsius {raw use_internal} {
    if {$raw == 0 || $raw == 65535} {error "Invalid/uninitialized temperature reading"}
    if {$use_internal} {return [expr {$raw * 509.3140064 / 65536.0 - 280.23087870}]}
    return [expr {$raw * 507.5921310 / 65536.0 - 279.42657680}]
}

init
echo "CONFIGURATION_STATUS_BEFORE=[virtex2 read_stat 0]"
irscan fpga.tap 0x37
runtest 32
set flags [read_sysmon_status 63]
set use_internal [expr {($flags >> 9) & 1}]
echo [format "SYSMON_FLAGS=0x%04x INTERNAL_REFERENCE=%d OVER_TEMPERATURE=%d" $flags $use_internal [expr {($flags >> 3) & 1}]]
foreach {label address} {MAX_TEMPERATURE_SINCE_SYSMON_RESET 32 MIN_TEMPERATURE_SINCE_SYSMON_RESET 36} {
    set raw [read_sysmon_status $address]
    echo [format "%s_C=%.2f RAW=0x%04x" $label [as_celsius $raw $use_internal] $raw]
}
foreach {label address} {VCCINT 1 VCCAUX 2 VREFP 4 VCCBRAM 6} {
    set raw [read_sysmon_status $address]
    echo [format "%s_V=%.4f RAW=0x%04x" $label [expr {$raw * 3.0 / 65536.0}] $raw]
}
if {![info exists sample_count]} {set sample_count 10}
for {set sample 0} {$sample < $sample_count} {incr sample} {
    set raw [read_sysmon_status 0]
    echo [format "TEMPERATURE_SAMPLE=%d TEMP_C=%.2f RAW=0x%04x" $sample [as_celsius $raw $use_internal] $raw]
    sleep 1000
}
echo "CONFIGURATION_STATUS_AFTER=[virtex2 read_stat 0]"
irscan fpga.tap 0x3f
runtest 16
shutdown
